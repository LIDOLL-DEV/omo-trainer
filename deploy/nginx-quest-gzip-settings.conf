# Shared compression settings for the four LiDollQuest zone locations in nginx-quest-gzip.conf.
# Install next to it as /etc/nginx/snippets/nginx-quest-gzip-settings.conf.
gzip on;                         # Already on globally in nginx.conf, but only for text/html; repeated here so this file stands alone.
gzip_types application/json;     # The snapshot type (text/html is always included by nginx).
gzip_min_length 1024;            # Error replies and tiny bodies aren't worth compressing.
gzip_comp_level 4;               # ~8x on snapshots; level 6+ adds CPU for barely any extra saving.
gzip_vary on;                    # Adds "Vary: Accept-Encoding" so any cache keeps compressed and plain copies apart.
# Browsers always ask for gzip and unpack it themselves. Whether the native desktop client asks is untested; it gets
# plain JSON if it doesn't, so nothing breaks either way. Check that before the desktop release.
