# Add this location inside an HTTPS server block for auth.sadgirlsclub.wtf.
# If that server block does not exist, use nginx-auth-server.conf and AUTH_PROXY_SETUP.md instead.
# Use the site's actual TLS certificate configuration and point DNS at the reverse proxy.
# The identity service must use AUTH_ISSUER=https://auth.sadgirlsclub.wtf and AUTH_TRUST_PROXY=1.
# Administrator password resets are a private tracker-to-identity back channel, never public.
location = /admin/reset-password { return 404; }

location / {
    proxy_pass http://10.1.1.23:4180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_cache off;
    client_max_body_size 16k;
}
