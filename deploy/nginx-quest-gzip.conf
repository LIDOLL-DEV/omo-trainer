# Compress LiDollQuest zone snapshots on their way out to players (about 8x smaller: a crowded poll goes from ~70 KiB to ~10 KiB).
# Include INSIDE the existing lidoll.dev HTTPS server block, next to the nginx-gallery.conf include:
#
#     include /etc/nginx/snippets/nginx-quest-gzip.conf;
#
# Why exact-match locations: the block's `location ^~ /tracker/` stops nginx from checking regex locations, but `location =`
# always wins first. Only these four game routes are compressed. They carry no secrets in the body (the bearer token and
# CSRF token travel in headers), so compressing them is safe from BREACH-style attacks, which need a secret and
# attacker-typed text (chat) in the same compressed body. Login, token and wallet replies elsewhere under /tracker/ stay
# uncompressed, and other sites on this proxy are unaffected.
# Only the internet leg is compressed; nginx -> tracker -> quest server on the LAN stays plain JSON.
# Each block repeats the /tracker/ proxy settings because nginx does not inherit proxy_pass into a sibling location.

location = /tracker/api/lidollcoin/v1/zones { # Desktop client: polls (GET).
    proxy_pass http://10.1.1.24:4173;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_cache off;
    client_max_body_size 256k;
    include /etc/nginx/snippets/nginx-quest-gzip-settings.conf;
}

location = /tracker/api/lidollcoin/v1/zones/action { # Desktop client: commands (POST), which also return a snapshot.
    proxy_pass http://10.1.1.24:4173;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_cache off;
    client_max_body_size 256k; # world_turn and enter carry the loadout (the quest server caps it at 192 KiB).
    include /etc/nginx/snippets/nginx-quest-gzip-settings.conf;
}

location = /tracker/api/lidollcoin/browser/zones { # Browser (HTML5) client: polls.
    proxy_pass http://10.1.1.24:4173;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_cache off;
    client_max_body_size 256k;
    include /etc/nginx/snippets/nginx-quest-gzip-settings.conf;
}

location = /tracker/api/lidollcoin/browser/zones/action { # Browser (HTML5) client: commands.
    proxy_pass http://10.1.1.24:4173;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_cache off;
    client_max_body_size 256k;
    include /etc/nginx/snippets/nginx-quest-gzip-settings.conf;
}
